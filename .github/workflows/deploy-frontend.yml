name: Deploy Frontend

# Single-job build + deploy with bulletin-deploy and a retry wrapper.
# Both push-to-main and PRs deploy to a live, resolvable domain — main to the
# fixed `t3rminal.dot`, PRs to a `pr<N>-` prefixed preview. The only difference:
# `--publish` is passed ONLY on main. `--publish` registers the full Polkadot
# product manifest (icon/displayName/app.<domain> subname) — i.e. it PINS the
# bundle into the app's product registry. Without it the domain still resolves
# and the preview is live/scannable; it just isn't pinned as a product.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip-cache:
        description: 'Force redeploy (skip cache)'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # The committed lockfile includes Linux and macOS optional native packages.
        run: npm ci

      - name: Generate PAPI descriptors
        run: npm run papi:generate

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
          # NEXT_PUBLIC_* are baked into the JS bundle at build — must live on
          # this step, not on Deploy (where they'd be a no-op).
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          # Disable automatic tracing in production — baked explicitly so the
          # bundle never falls back to a higher rate regardless of code default.
          # Raise (e.g. 0.1) only if you want a sample of transactions traced.
          NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: '1.0'
          # main is the pinned production product; PR deploys go to their own
          # live preview domain (not pinned in the app). Label them distinctly so
          # the Sentry dashboard can separate prod traffic from preview traffic.
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
          # Contract wiring. CI has no .env.local (gitignored) and never runs
          # the contract deploy, so without these the build bakes the
          # lib/contracts/config.ts defaults. They're public values, so they
          # live in repo *variables*, not secrets. Unset → empty string →
          # config.ts falls back to its (paseo-next-v2) defaults, which is the
          # safe behavior. Set the variable after a chain reset + redeploy to
          # point CI builds at the new contract without a code change.
          NEXT_PUBLIC_NETWORK: ${{ vars.NEXT_PUBLIC_NETWORK }}
          NEXT_PUBLIC_BULLETIN_INDEX_ADDRESS: ${{ vars.NEXT_PUBLIC_BULLETIN_INDEX_ADDRESS }}
          NEXT_PUBLIC_ASSET_HUB_WS: ${{ vars.NEXT_PUBLIC_ASSET_HUB_WS }}

      - name: Setup IPFS
        uses: ipfs/download-ipfs-distribution-action@v1
        with:
          name: kubo
          version: v0.33.0
      - run: ipfs init

      - name: Install deploy tool
        run: npm install -g bulletin-deploy@latest

      - name: Deploy
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          # Paseo Next v2 DotNS rule (dev signers, no PoP): label = ≥9
          # alphanumeric chars + 2 trailing digits. Production `t3rminal.dot`
          # is registered under a signer that bypasses this rule; PR previews
          # still use a `pr<N>-` prefix on the legacy `t3rminal01` base so
          # the trailing `01` keeps them DotNS-valid for the dev signer.
          #
          # Both targets deploy to a live, resolvable domain. Only main passes
          # `--publish` — that pins the bundle as a Polkadot product (manifest +
          # app.<domain> subname). PR previews skip it: still live/scannable, just
          # not pinned in the app's product registry, and they never touch the
          # production `t3rminal.dot` domain.
          #
          # BULLETIN_DEPLOY_DOMAIN is exported so `bulletin-deploy.config.ts`
          # sees the same value the CLI is invoked with — without this the
          # config's hardcoded default ("t3rminal.dot") would fight a
          # PR-preview deploy and the manifest step aborts.
          command: |
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              DOMAIN="pr${{ github.event.pull_request.number }}-t3rminal01.dot"
              export BULLETIN_DEPLOY_DOMAIN="$DOMAIN"
              bulletin-deploy --env paseo-next-v2 './out' "$DOMAIN"
            else
              DOMAIN="t3rminal.dot"
              export BULLETIN_DEPLOY_DOMAIN="$DOMAIN"
              bulletin-deploy --publish --env paseo-next-v2 './out' "$DOMAIN"
            fi
        env:
          MNEMONIC: ${{ secrets.DOTNS_MNEMONIC }}
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Comment on PR
        # Skip for fork PRs: `pull_request` from a fork runs with a read-only
        # GITHUB_TOKEN regardless of the job-level `pull-requests: write`
        # permission (security default — avoids fork PRs writing to upstream).
        # The `issues/<n>/comments` API returns 403 "Resource not accessible
        # by integration" and the whole deploy job fails. Branch PRs from the
        # same repo still get the preview comment.
        if: github.event.pull_request && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const domain = `pr${{ github.event.pull_request.number }}-t3rminal01`;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `**${domain}.dot** · [logs](${runUrl})\n\nhttps://${domain}.dot.li`
            });
